<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragant Music</title>
<meta name="description" content="Música, videos, eventos y devocionales de Fragant Music, ministerio musical cristiano de República Dominicana.">
<meta property="og:title" content="Fragant Music | Música Fragante de Salvación">
<meta property="og:description" content="Escucha, mira y comparte la música de Fragant Music.">
<meta property="og:image" content="https://fragantmusic.com/og.jpg">
<meta name="theme-color" content="#0B0A09">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--ink:#0B0A09;--s1:#151311;--s2:#1E1B18;--line:#2E2A25;--cream:#F3F0E8;--soft:#D8D1C4;--mute:#A89F90;--gold:#E8B82A;--orange:#E07F20;
  --flame:linear-gradient(150deg,var(--gold) 10%,var(--orange) 90%);
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.6 var(--body);min-height:100vh}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 20px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;font:700 1rem var(--display)}
.brand img{width:28px}
.card{background:var(--s1);border-radius:22px;overflow:hidden}
.cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--s2)}
.cover.wide{aspect-ratio:16/9}
.body{padding:22px;display:grid;gap:14px}
.eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font:800 clamp(1.9rem,7vw,2.5rem)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--soft);margin:0}
.meta{color:var(--mute);font-size:.92rem;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;text-decoration:none;font-size:.95rem;border:1px solid var(--line);background:none;color:var(--cream);cursor:pointer}
.btn.primary{background:var(--flame);border-color:transparent;color:#1a1000}
.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
audio{width:100%}
.verse{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;color:var(--soft);margin:0}
.lyrics{white-space:pre-line;color:var(--soft);margin:0;font-size:1.02rem}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
.app{margin-top:22px;background:radial-gradient(120% 140% at 100% 0%,rgba(232,184,42,.2),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px}
.app h2{font:800 1.3rem var(--display);margin:0}
.center{text-align:center;padding:60px 0;display:grid;gap:14px;justify-items:center;color:var(--mute)}
.skeleton{height:420px;border-radius:22px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><img src="/logo-claro.png" alt="">Fragant Music</a>
    <a class="btn" href="/">Inicio</a>
  </header>
  <main id="main"><div class="skeleton" aria-label="Cargando"></div></main>
  <section class="app">
    <span class="eyebrow">Muy pronto</span>
    <h2>La app oficial de Fragant Music</h2>
    <p class="meta">Música, videos, agenda, devocionales y avisos en vivo. Para iPhone y Android.</p>
  </section>
</div>
<script>
(function () {
  var API = 'https://api.fragantmusic.com/api/v1';
  var main = document.getElementById('main');
  var m = location.pathname.match(/^\/c\/([a-z0-9-]{1,80})\/?$/);
  var LABEL = { SONG: 'Canción', VIDEO: 'Video', EVENT: 'Evento', DEVOTIONAL: 'Un momento con Dios', NEWS: 'Noticias', GALLERY: 'Fragant Moments' };
  var PLATFORMS = [['spotify','Spotify'],['appleMusic','Apple Music'],['youtubeMusic','YouTube Music'],['youtube','YouTube'],['amazonMusic','Amazon Music'],['deezer','Deezer'],['tidal','Tidal']];

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) n.setAttribute(k, attrs[k]); });
    (children || []).forEach(function (c) { if (c != null) n.append(c); });
    return n;
  }
  function text(tag, cls, t) { var n = el(tag, cls ? { class: cls } : {}); n.textContent = t; return n; }
  function notFound() {
    document.title = 'Fragant Music';
    main.replaceChildren(el('div', { class: 'center' }, [
      text('h1', '', m ? 'Este contenido ya no está disponible' : 'Esta página no existe'),
      text('p', 'meta', 'Puede que se haya movido o eliminado.'),
      el('a', { class: 'btn primary', href: '/' }, ['Ir a fragantmusic.com'])
    ]));
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    var s = d.toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · ' + d.toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  if (!m) return notFound();
  fetch(API + '/posts/' + m[1]).then(function (r) { return r.ok ? r.json() : null; }).then(function (res) {
    if (!res || !res.success) return notFound();
    var p = res.data;
    document.title = p.title + ' — Fragant Music';
    var img = p.cover ? (p.type === 'SONG' ? p.cover.urls.square : p.cover.urls.wide) : (p.video ? p.video.thumbnail : null);
    var body = el('div', { class: 'body' }, [text('span', 'eyebrow', LABEL[p.type] || 'Fragant Music'), text('h1', '', p.title)]);

    if (p.event) {
      body.append(text('p', 'meta', fmtDate(p.event.startsAt)));
      var place = [p.event.venue, p.event.address, p.event.city].filter(Boolean).join(', ');
      if (place) body.append(text('p', 'meta', '📍 ' + place));
    }
    if (p.summary) body.append(text('p', 'lede', p.summary));
    if (p.devotional) {
      body.append(text('p', 'verse', '“' + p.devotional.verseText + '” — ' + p.devotional.verseRef));
      if (p.devotional.reflection) body.append(text('p', 'lyrics', p.devotional.reflection));
    }
    if (p.song && p.song.audio && p.song.audio.url) body.append(el('audio', { controls: '', preload: 'none', src: p.song.audio.url }));

    var btns = el('div', { class: 'btns' });
    if (p.song) PLATFORMS.forEach(function (pl) {
      if (p.song.links[pl[0]]) btns.append(el('a', { class: 'btn', href: p.song.links[pl[0]], target: '_blank', rel: 'noopener' }, [pl[1]]));
    });
    if (p.video) btns.append(el('a', { class: 'btn primary', href: p.video.url, target: '_blank', rel: 'noopener' }, ['▶ Ver en YouTube']));
    if (p.event && p.event.lat != null) btns.append(el('a', { class: 'btn', href: 'https://www.google.com/maps/dir/?api=1&destination=' + p.event.lat + ',' + p.event.lng, target: '_blank', rel: 'noopener' }, ['Cómo llegar']));
    if (p.event && p.event.ticketUrl) btns.append(el('a', { class: 'btn primary', href: p.event.ticketUrl, target: '_blank', rel: 'noopener' }, ['Entradas']));
    if (btns.childNodes.length) body.append(btns);

    if (p.song && p.song.lyrics) {
      var det = el('details', {}, [text('summary', '', 'Ver la letra'), text('p', 'lyrics', p.song.lyrics)]);
      body.append(det);
    }
    if (p.body) body.append(text('p', 'lyrics', p.body));

    main.replaceChildren(el('article', { class: 'card' }, [
      img ? el('img', { class: 'cover' + (p.type === 'SONG' ? '' : ' wide'), src: img, alt: 'Portada de ' + p.title }) : null,
      body
    ]));
  }).catch(notFound);
})();
</script>
</body>
</html>
